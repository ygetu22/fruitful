[project]
name = "fruitful"
version = "0.1.0"
description = "Your AI co-producer for FL Studio — an MCP server for native FL Studio control."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "mido>=1.3",
    "python-rtmidi>=1.5",
]

[project.scripts]
fruitful = "fruitful.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fruitful"]
