[project]
name = "fruitful"
version = "0.1.0b1"
description = "Control FL Studio through a local MCP server."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.2,<4",
    "mido>=1.3",
    "python-rtmidi>=1.5",
]

[project.scripts]
fruitful = "fruitful.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fruitful"]

[tool.hatch.build.targets.wheel.force-include]
"device/device_Fruitful.py" = "fruitful/resources/device_Fruitful.py"
"pianoroll/Fruitful Apply.pyscript" = "fruitful/resources/Fruitful Apply.pyscript"

[tool.hatch.build.targets.sdist]
include = ["src/fruitful", "device", "pianoroll", "tests", "README.md", "LICENSE", "SECURITY.md", "SPEC.md", "NOTES.md", "docs", "pyproject.toml"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
